# Servidor de la SPA compilada. Escucha en 5173 para que el proxy principal
# (Proxy/nginx/locations.conf) funcione igual que con el servidor de desarrollo de Vite.
server {
	listen 5173;
	server_name _;
	root /usr/share/nginx/html;

	# Archivos con hash en el nombre: se pueden cachear indefinidamente.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# Rutas de React Router (/archivos, /usuarios...) devuelven index.html.
	location / {
		try_files $uri $uri/ /index.html;
		add_header Cache-Control "no-cache";
	}
}
