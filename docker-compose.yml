services:
  authdb:
    image: postgres:16-alpine
    container_name: authdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - authdb_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ../React/dist:/usr/share/nginx/html:ro
    depends_on:
      authservice:
        condition: service_started

  authservice:
    build:
      context: ./AuthService
      dockerfile: Dockerfile
      target: dev
    container_name: authservice
    restart: unless-stopped
    depends_on:
      authdb:
        condition: service_healthy
    environment:
      DB_HOST: authdb
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      SEED_DEMO_USERS: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS}
    ports:
      - "5098:8080"
    volumes:
      - ./AuthService:/src
      - authservice_bin:/src/bin
      - authservice_obj:/src/obj

volumes:
  authdb_data:
  authservice_bin:
  authservice_obj:
