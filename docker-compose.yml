services:
  authdb:
    image: postgres:16-alpine
    container_name: authdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - authdb_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  certs-init:
    image: alpine:latest
    container_name: certs-init
    volumes:
      - ./Backend/nginx/certs:/certs
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /certs/localhost.crt ] && [ -f /certs/localhost.key ]; then
          echo "SSL certificates already exist, skipping."
          exit 0
        fi
        echo "Generating SSL certificate for localhost..."
        apk add --no-cache openssl >/dev/null 2>&1
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout /certs/localhost.key \
          -out /certs/localhost.crt \
          -subj "/CN=localhost" \
          -addext "subjectAltName=DNS:localhost,DNS:*.localhost,IP:127.0.0.1" >/dev/null 2>&1
        echo "Certificates generated successfully in ./Backend/nginx/certs"
        exit 0
    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Backend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Backend/nginx/locations.conf:/etc/nginx/locations.conf:ro
      - ./Backend/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
      authservice:
        condition: service_started
      frontend:
        condition: service_started
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: dev
    container_name: frontend
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules

  authservice:
    build:
      context: ./Backend/AuthService
      dockerfile: Dockerfile
      target: dev
    container_name: authservice
    restart: unless-stopped
    depends_on:
      authdb:
        condition: service_healthy
    environment:
      DB_HOST: authdb
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      SEED_DEMO_USERS: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS}
      MINIO_SVCACCT_ACCESS_KEY: ${MINIO_SVCACCT_ACCESS_KEY}
      MINIO_SVCACCT_SECRET_KEY: ${MINIO_SVCACCT_SECRET_KEY}
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET}
      MINIO_S3_URL: ${MINIO_S3_URL:-http://minio:9000}
    ports:
      - "5098:8080"
    volumes:
      - ./Backend/AuthService:/src
      - authservice_bin:/src/bin
      - authservice_obj:/src/obj

  minio:
    image: firstfinger/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "off"
      CONSOLE_SUBPATH: "/storage"
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"   # S3 API
      - "9002:9002"   # Admin Console (custom)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: firstfinger/minio:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      NEW_USER: ${MINIO_SERVICE_USER}
      NEW_USER_PASSWORD: ${MINIO_SERVICE_USER_PASSWORD}
      SVCACCT_ACCESS_KEY: ${MINIO_SVCACCT_ACCESS_KEY}
      SVCACCT_SECRET_KEY: ${MINIO_SVCACCT_SECRET_KEY}
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for MinIO to be ready..."
        until mc alias set myminio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 1
        done

        echo "Creating user: $$NEW_USER"
        mc admin user add myminio "$$NEW_USER" "$$NEW_USER_PASSWORD"

        echo "Attaching readwrite policy to $$NEW_USER..."
        mc admin policy attach myminio readwrite --user "$$NEW_USER"

        echo "Creating bucket: $$MINIO_DEFAULT_BUCKET"
        mc mb --ignore-existing "myminio/$$MINIO_DEFAULT_BUCKET"

        echo "Creating service account for $$NEW_USER..."
        mc admin user svcacct add \
          --access-key "$$SVCACCT_ACCESS_KEY" \
          --secret-key "$$SVCACCT_SECRET_KEY" \
          myminio "$$NEW_USER"

        echo "Setup completed successfully."
        exit 0
    restart: "no"

volumes:
  authdb_data:
  authservice_bin:
  authservice_obj:
  frontend_node_modules:
  minio-data:
    driver: local
